<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e1116">
<link rel="icon" href="data:,">
<title>RODADA NA TELA!</title>
<style>
  :root { --bg:#0e1116; --panel:#171b22; --line:#262c36; --ink:#e8ecf2; --dim:#8b95a5;
          --win:#3ecf8e; --loss:#f0616d; --tie:#e9b44c; --live:#5aa9ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 40px; }
  .grid { display:grid; grid-template-columns: minmax(0, 1fr); gap: 10px; align-items:start; }
  @media (min-width: 860px) {
    main { max-width: 1080px; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  }
  h1 { font-size: 1.6rem; margin: 0 0 2px; letter-spacing: .02em; font-weight: 800; }
  .sub { color: var(--dim); margin: 0 0 14px; font-size: .88rem; }
  .status { display:flex; flex-wrap:wrap; gap:8px; margin-bottom: 6px; }
  .pill { border:1px solid var(--line); border-radius: 999px; padding: 4px 11px; font-size:.8rem; color:var(--dim); }
  .pill b { color: var(--ink); font-weight: 600; }
  .pill.warn { border-color: var(--tie); color: var(--tie); }
  h2 { font-size:.72rem; text-transform:uppercase; letter-spacing:.12em; color:var(--dim); margin: 22px 0 8px; font-weight:600; }
  h3 { font-size:.8rem; color:var(--ink); margin: 16px 0 8px; font-weight:600; }
  h3 span { color:var(--dim); font-weight:400; }
  h2 + h3 { margin-top: 4px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius: 12px; padding: 13px 14px; }
  .card.playing { border-color: var(--live); }
  .top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .name { font-weight: 650; font-size: 1.02rem; margin:0; overflow-wrap:anywhere; }
  .meta { color:var(--dim); font-size:.82rem; margin: 1px 0 0; }
  .rec { font: 700 1.55rem/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; white-space:nowrap; font-variant-numeric: tabular-nums; }
  .rec i { font-style:normal; color:var(--dim); font-weight:400; padding:0 1px; }
  .chips { display:flex; flex-wrap:wrap; gap:5px; list-style:none; padding:0; margin: 10px 0 0; }
  .chips li { font-size:.72rem; font-weight:700; border-radius:6px; padding: 3px 7px; background:#222833; color:var(--dim); }
  .chips .W { background: rgba(62,207,142,.16); color: var(--win); }
  .chips .L { background: rgba(240,97,109,.16); color: var(--loss); }
  .chips .T { background: rgba(233,180,76,.16); color: var(--tie); }
  .chips .LIVE { background: rgba(90,169,255,.16); color: var(--live); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.55; } }
  @media (prefers-reduced-motion: reduce) { .chips .LIVE { animation:none; } }
  .nowline { margin: 9px 0 0; font-size:.88rem; overflow-wrap:anywhere; }
  .nowline .dot { color: var(--live); }
  .flag { width:20px; height:15px; border-radius:2px; vertical-align:-2px; margin-right:6px; font-size:.7rem; color:var(--dim); }
  .chips .flag { width:16px; height:12px; margin:0 0 0 5px; vertical-align:-1px; }
  .note { margin: 8px 0 0; font-size:.78rem; color: var(--tie); }
  .quali { margin: 8px 0 0; font-size:.82rem; color: var(--dim); }
  .quali.ok { color: var(--win); }
  .quali.champ { color: var(--tie); font-weight: 650; }
  .chips li.brk { margin-left: 9px; }
  tr.brk td { border-top: 1px solid var(--line); padding-top: 7px; }
  .card.over { opacity: .72; }
  details { margin-top: 9px; border-top:1px solid var(--line); padding-top: 8px; }
  summary { cursor:pointer; color:var(--dim); font-size:.8rem; }
  table { width:100%; border-collapse:collapse; margin-top:6px; font-size:.84rem; }
  td { padding: 4px 6px 4px 0; vertical-align:top; overflow-wrap:anywhere; }
  td.r { color:var(--dim); width:2.4em; white-space:nowrap; padding-right:10px; } td.res { width:1.6em; font-weight:700; } td.tb { color:var(--dim); text-align:right; white-space:nowrap; }
  .W { color: var(--win); } .L { color: var(--loss); } .T { color: var(--tie); } .LIVE { color: var(--live); }
  .dim { color: var(--dim); }
  footer { color:var(--dim); font-size:.76rem; margin-top: 26px; }
  a { color: inherit; }
  .empty { color: var(--dim); padding: 30px 0; text-align:center; }
</style>
</head>
<body>
<main>
  <h1>RODADA NA TELA!</h1>
  <p class="sub" id="sub">Carregando…</p>
  <div class="status" id="status"></div>
  <div id="list"><p class="empty">Carregando…</p></div>
  <footer>
    Dados: <a id="src" href="https://www.pokedata.ovh/standings2/" rel="noopener">pokedata.ovh</a>, calculados a partir dos pareamentos do RK9. Não oficial.
    <span id="age"></span>
  </footer>
</main>
<script>
(function () {
  var LABEL = { W: 'V', L: 'D', T: 'E', LIVE: '●', '?': '?' };
  var WORD = { W: 'Vitória', L: 'Derrota', T: 'Empate', LIVE: 'Jogando', '?': 'Sem resultado' };
  var DIV = { Masters: 'Masters', Senior: 'Seniors', Junior: 'Juniors' };
  // The poller uploads this file once a minute. It is a script (it calls
  // window.__rodadaData) so it loads cross-origin without any CORS setup.
  var DATA_URL = 'https://temp-assets.gin.codes/rodada-na-tela/data.jsonp';
  var STALE_MS = 5 * 60 * 1000;
  var last = null;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function num(n) { return Number(n).toLocaleString('pt-BR'); }
  function clock(t) { return new Date(t).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); }
  function ago(ms) {
    var m = Math.max(0, Math.round(ms / 60000));
    if (m < 1) return 'agora';
    if (m < 90) return 'há ' + m + ' min';
    return 'há ' + Math.round(m / 60) + ' h';
  }
  var regionNames = null;
  try { regionNames = new Intl.DisplayNames(['pt-BR'], { type: 'region' }); } catch (e) {}
  // Flag of an ISO country code (the standings use "UK" for the United Kingdom).
  // If the image cannot load, its alt text (the code) is shown instead.
  function flag(code) {
    if (!code || !/^[A-Za-z]{2}$/.test(code)) return '';
    var iso = code.toUpperCase() === 'UK' ? 'GB' : code.toUpperCase();
    var name = iso;
    try { if (regionNames) name = regionNames.of(iso) || iso; } catch (e) {}
    var base = 'https://flagcdn.com/';
    var file = '/' + iso.toLowerCase() + '.png';
    return '<img class="flag" src="' + base + '20x15' + file + '" srcset="' + base + '40x30' + file + ' 2x" width="20" height="15" alt="' + esc(iso) + '" title="' + esc(name) + '" loading="lazy">';
  }
  function versus(r) {
    if (r.bye) return 'bye <span class="dim">(vitória automática)</span>';
    if (!r.opponent) return '<span class="dim">sem pareamento (derrota)</span>';
    return flag(r.opponent.country) + esc(r.opponent.name) + ' <span class="dim">(' + esc(r.opponent.record) + ')</span>';
  }

  // Rounds: phase 1 swiss, then phase 2 swiss, then the top cut (named by the poller).
  function isTop(d, n) { return !!(d.topCut && d.topCut[n]); }
  function roundName(d, n) { return isTop(d, n) ? d.topCut[n] : 'R' + n; }
  function phase(d, n) { return isTop(d, n) ? 'top' : (d.day1 && n > d.day1 ? 'day2' : 'day1'); }
  function topStarted(d) { return !!d.topCut && Object.keys(d.topCut).length > 0; }

  // Masters play all of phase 1 on Friday, so the phases are "dia 1" and "dia 2".
  // Seniors and Juniors stop at round 6 on Friday and finish phase 1 on Saturday,
  // so for them the same two phases are called "fase 1" and "fase 2".
  function words(d) {
    return d.division === 'Masters'
      ? { P2: 'Dia 2', doP2: 'do dia 2', noP2: 'no dia 2', aoP2: 'ao dia 2', oP2: 'o dia 2', noP1: 'no dia 1', p1Over: 'Dia 1 encerrado' }
      : { P2: 'Fase 2', doP2: 'da fase 2', noP2: 'na fase 2', aoP2: 'à fase 2', oP2: 'a fase 2', noP1: 'na fase 1', p1Over: 'Fase 1 encerrada' };
  }
  function cap(t) { return t.charAt(0).toUpperCase() + t.slice(1); }
  function phase1Over(d) { return !!d.day1 && d.round === d.day1 && !(d.tablesLive > 0); }

  // Where the player stands in the tournament structure: one line under the
  // chips. Returns { html, over, group }: over means "this player is done";
  // group is the section the card goes in (active, outTop, out2 or out1).
  function standing(p, d) {
    var rounds = p.rounds || [];
    var w = words(d);
    var place = 'terminou em #' + num(p.rank);
    var beyond1 = !!d.day1 && rounds.length > d.day1;
    var inTop = rounds.some(function (r) { return isTop(d, r.n); });
    var outGroup = inTop ? 'outTop' : (beyond1 ? 'out2' : 'out1');
    // Once the next phase is paired, the source can flag everybody who is not in
    // it as "dropped" after the previous phase's last round. That is the cut, not a drop.
    var swiss = d.day1 ? d.day1 + (d.day2 || 0) : 0;
    var drop = p.droppedAfter;
    var cutNotDrop = drop != null && !!d.day1 && ((drop === d.day1 && d.round > d.day1) || (drop === swiss && d.round > swiss));
    if (drop != null && !cutNotDrop) return { html: '<p class="note">Drop após a rodada ' + drop + '.</p>', over: true, group: outGroup };
    if (!d.day1 || !d.round) return { html: '', over: false, group: 'active' };
    var cut = d.day2Points;

    if (d.round <= d.day1) { // phase 1 running, or finished with no phase 2 pairings yet
      var html = '';
      if (rounds.length < d.round) html += '<p class="note">Sem pareamento na rodada ' + d.round + '.</p>';
      if (!cut) return { html: html, over: false, group: 'active' };
      var done = rounds.filter(function (r) { return r.result !== 'LIVE'; }).length;
      var left = Math.max(0, d.day1 - done);
      if (p.points >= cut) {
        html += '<p class="quali ok">✓ Atingiu o corte ' + w.doP2 + ' (' + cut + '+ pts)</p>';
      } else if (p.points + 3 * left < cut) {
        html += '<p class="quali">' + (left === 0 ? 'Abaixo do corte ' : 'Não alcança mais o corte ') + w.doP2 + ' (' + cut + ' pts)</p>';
        return { html: html, over: left === 0, group: left === 0 ? 'out1' : 'active' };
      } else {
        var need = cut - p.points;
        html += '<p class="quali">' + w.P2 + ': ' + (need === 1 ? 'falta 1 pt' : 'faltam ' + need + ' pts') + ' em ' + left + (left === 1 ? ' rodada' : ' rodadas') + '</p>';
      }
      return { html: html, over: false, group: 'active' };
    }

    if (!beyond1) {
      // Reached the cut but has no phase 2 pairing: did not show up for it.
      var p1 = 0;
      rounds.slice(0, d.day1).forEach(function (r) { p1 += r.result === 'W' ? 3 : (r.result === 'T' ? 1 : 0); });
      var text = cut && p1 >= cut ? 'Não jogou ' + w.oP2 : 'Não avançou ' + w.aoP2;
      return { html: '<p class="quali">' + text + ' · ' + place + '</p>', over: true, group: 'out1' };
    }

    if (inTop) {
      var topRounds = rounds.filter(function (r) { return isTop(d, r.n); });
      var lastTop = topRounds[topRounds.length - 1];
      if (lastTop.result === 'L' && roundName(d, lastTop.n) === 'Final') return { html: '<p class="quali champ">🥈 Vice-campeão</p>', over: false, group: 'active' };
      if (lastTop.result === 'L') return { html: '<p class="quali">Eliminado no ' + esc(roundName(d, lastTop.n)) + ' · ' + place + '</p>', over: true, group: 'outTop' };
      if (lastTop.result === 'W' && roundName(d, lastTop.n) === 'Final') return { html: '<p class="quali champ">🏆 Campeão!</p>', over: false, group: 'active' };
      return { html: '<p class="quali ok">No top cut</p>', over: false, group: 'active' };
    }
    if (topStarted(d) || d.round > swiss) return { html: '<p class="quali">Fim ' + w.doP2 + ' · ' + place + '</p>', over: true, group: 'out2' };
    if (rounds.length < d.round) return { html: '<p class="note">Sem pareamento na rodada ' + d.round + '.</p>', over: false, group: 'active' };
    return { html: '<p class="quali ok">' + cap(w.noP2) + '</p>', over: false, group: 'active' };
  }

  // Section titles inside a division: who is still in, and where the others stopped.
  function groupTitle(g, d) {
    var w = words(d);
    if (g === 'outTop') return 'Eliminados no top cut';
    if (g === 'out2') return 'Encerraram ' + w.noP2;
    if (g === 'out1') return 'Encerraram ' + w.noP1;
    if (topStarted(d)) return 'No top cut';
    if (d.day1 && d.round > d.day1) return cap(w.noP2);
    if (phase1Over(d)) return 'Atingiram o corte ' + w.doP2;
    return 'Em jogo';
  }

  function card(p, d) {
    if (p.missing) {
      return '<article class="card"><p class="name">' + esc(p.name) + '</p><p class="meta">Não encontrado nos standings de ' + esc(DIV[d.division] || d.division) + '.</p></article>';
    }
    var rounds = p.rounds || [];
    var cur = rounds.length ? rounds[rounds.length - 1] : null;
    var playing = !!cur && cur.result === 'LIVE';
    var st = standing(p, d);
    var h = '<article class="card' + (playing ? ' playing' : '') + (st.over && !playing ? ' over' : '') + '" data-k="' + esc(d.division + '#' + p.id) + '">';
    h += '<div class="top"><div><p class="name">' + esc(p.name) + '</p>';
    h += '<p class="meta">#' + num(p.rank) + ' de ' + num(d.total) + ' · ' + p.points + ' pts</p></div>';
    h += '<div class="rec" aria-label="Vitórias, derrotas, empates">' + p.record[0] + '<i>-</i>' + p.record[1] + '<i>-</i>' + p.record[2] + '</div></div>';
    if (rounds.length) {
      h += '<ol class="chips">';
      rounds.forEach(function (r, i) {
        var brk = i > 0 && phase(d, r.n) !== phase(d, rounds[i - 1].n);
        var title = r.bye ? 'Bye (vitória automática)' : (!r.opponent && r.result === 'L' ? 'Sem pareamento (derrota)' : WORD[r.result] || '');
        h += '<li class="' + esc(r.result) + (brk ? ' brk' : '') + '" title="' + esc(title) + '">' + esc(roundName(d, r.n)) + ' ' +
          (r.bye ? 'BYE' : (LABEL[r.result] || '?')) + (r.opponent ? flag(r.opponent.country) : '') + '</li>';
      });
      h += '</ol>';
    }
    if (playing) {
      h += '<p class="nowline"><span class="dot">●</span> Jogando ' + (isTop(d, cur.n) ? 'o ' : 'a ') + esc(roundName(d, cur.n)) + (cur.table ? ' · mesa ' + cur.table : '') + ' · vs ' + versus(cur) + '</p>';
    } else if (cur && cur.bye && cur.n === d.round && d.tablesLive > 0) {
      h += '<p class="nowline"><span class="W">●</span> Bye ' + (isTop(d, cur.n) ? 'no ' : 'na ') + esc(roundName(d, cur.n)) + ' · vitória automática, sem mesa</p>';
    }
    h += st.html;
    if (p.homonyms > 1) h += '<p class="note">' + p.homonyms + ' jogadores com este nome no torneio (id ' + p.id + ').</p>';
    if (rounds.length) {
      h += '<details><summary>Rodadas</summary><table>';
      rounds.forEach(function (r, i) {
        var brk = i > 0 && phase(d, r.n) !== phase(d, rounds[i - 1].n);
        h += '<tr' + (brk ? ' class="brk"' : '') + '><td class="r">' + esc(roundName(d, r.n)) + '</td><td class="res ' + esc(r.result) + '">' + (LABEL[r.result] || '?') + '</td><td>' + versus(r) + '</td>';
        h += '<td class="tb">' + (r.table ? 'mesa ' + r.table : '') + '</td></tr>';
      });
      h += '</table></details>';
    }
    return h + '</article>';
  }

  // Header pill: which round the division is in.
  function pill(d) {
    var name = esc(DIV[d.division] || d.division);
    var live = d.tablesLive > 0;
    var text;
    if (isTop(d, d.round)) {
      var label = d.topCut[d.round];
      text = '<b>' + esc(label) + '</b> · ' + (live ? 'jogando' : (label === 'Final' ? 'torneio encerrado' : 'encerrado'));
    } else if (d.day1 && d.round > d.day1) {
      text = words(d).P2 + ' · <b>Rodada ' + d.round + (d.day2 ? '/' + (d.day1 + d.day2) : '') + '</b> · ' + (live ? num(d.tablesLive) + ' mesas jogando' : 'encerrada');
    } else if (phase1Over(d)) {
      text = '<b>' + words(d).p1Over + '</b> · ' + d.day1 + ' rodadas';
    } else {
      text = '<b>Rodada ' + d.round + (d.day1 ? '/' + d.day1 : '') + '</b> · ' + (live ? num(d.tablesLive) + ' mesas jogando' : 'encerrada');
    }
    return '<span class="pill">' + name + ': ' + text + '</span>';
  }

  function render(s) {
    last = s;
    var divs = s.divisions || [];
    var t = divs.filter(function (d) { return d.title; })[0];
    document.getElementById('sub').textContent = t ? t.title + (t.date ? ' · ' + t.date : '') : 'Acompanhando a liga';
    if (s.sourcePage) document.getElementById('src').href = s.sourcePage;

    var open = {};
    Array.prototype.forEach.call(document.querySelectorAll('article[data-k]'), function (el) {
      var det = el.querySelector('details');
      if (det && det.open) open[el.getAttribute('data-k')] = 1;
    });

    var st = '';
    var html = '';
    divs.forEach(function (d) {
      var name = esc(DIV[d.division] || d.division);
      if (d.round != null) st += pill(d);
      var ps = (d.players || []).slice();
      if (!ps.length) return;
      ps.sort(function (a, b) { return (a.missing ? 1 : 0) - (b.missing ? 1 : 0) || (a.rank || 0) - (b.rank || 0); });
      html += '<h2>' + name + (d.total ? ' · ' + num(d.total) + ' jogadores' : '') + '</h2>';
      var groups = { active: [], outTop: [], out2: [], out1: [] };
      ps.forEach(function (p) { groups[p.missing ? 'active' : standing(p, d).group].push(p); });
      var order = ['active', 'outTop', 'out2', 'out1'].filter(function (g) { return groups[g].length; });
      // One plain list while everybody is still in phase 1; titled sections after that.
      var titled = order.length > 1 || order[0] !== 'active' || (d.day1 && d.round > d.day1) || phase1Over(d);
      order.forEach(function (g) {
        if (titled) html += '<h3>' + esc(groupTitle(g, d)) + ' <span>· ' + groups[g].length + '</span></h3>';
        html += '<div class="grid">';
        groups[g].forEach(function (p) { html += card(p, d); });
        html += '</div>';
      });
    });
    document.getElementById('status').innerHTML = st;
    var list = document.getElementById('list');
    list.innerHTML = html || '<p class="empty">Sem dados ainda.</p>';
    Array.prototype.forEach.call(list.querySelectorAll('article[data-k]'), function (el) {
      var det = el.querySelector('details');
      if (det && open[el.getAttribute('data-k')]) det.open = true;
    });
    tick();
  }

  function tick() {
    if (!last) return;
    var divs = last.divisions || [];
    var src = divs.map(function (d) { return d.sourceUpdated; }).filter(Boolean);
    var newest = src.length ? Math.max.apply(null, src) : null;
    var checked = last.generatedAt || null;
    var text = newest ? ' Standings das ' + clock(newest) + '.' : '';
    if (checked) {
      var age = Date.now() - checked;
      text += age > STALE_MS ? ' Sem atualização ' + ago(age) + ': confira no pokedata.' : ' Conferido ' + ago(age) + '.';
    }
    document.getElementById('age').textContent = text;
  }

  window.__rodadaData = render;

  function load() {
    var s = document.createElement('script');
    s.src = DATA_URL + '?t=' + Date.now();
    s.async = true;
    s.onload = function () { s.remove(); };
    s.onerror = function () {
      s.remove();
      if (!last) document.getElementById('list').innerHTML = '<p class="empty">Não foi possível carregar os dados. Tentando de novo…</p>';
      document.getElementById('age').textContent = ' Sem conexão; tentando de novo.';
    };
    document.head.appendChild(s);
  }
  load();
  setInterval(load, 30000);
  setInterval(tick, 15000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
})();
</script>
</body>
</html>
